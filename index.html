<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PonteFit</title>
<style>
/* ===== Tokens de diseño (claro / oscuro) ===== */
:root{
  --bg:#f7f3f4; --surface:#fff; --surface-2:#f0e7e9; --fg:#1d1214; --muted:#6e5a5f; --line:#e6d9dc;
  --accent:#e90137; --accent-fg:#fff; --ok:#1f8a5b; --warn:#a86a10; --bad:#a3122b;
  --ok-bg:#e3f4ec; --warn-bg:#fbf0dc; --bad-bg:#fbe5e5;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --display:"Arial Narrow","Roboto Condensed","Segoe UI",system-ui,sans-serif;
  --r:10px; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141012; --surface:#1e171a; --surface-2:#2b2125; --fg:#f3ebed; --muted:#b39fa4; --line:#3b2e33;
  --ok:#4cc38a; --warn:#e0a93e; --bad:#ff7a8f; --ok-bg:#16302a; --warn-bg:#352a14; --bad-bg:#3a1c1c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141012; --surface:#1e171a; --surface-2:#2b2125; --fg:#f3ebed; --muted:#b39fa4; --line:#3b2e33;
  --ok:#4cc38a; --warn:#e0a93e; --bad:#ff7a8f; --ok-bg:#16302a; --warn-bg:#352a14; --bad-bg:#3a1c1c; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--font);min-height:100vh}
.contenedor{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}

/* Cabecera y navegación */
.cabecera{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.cabecera > .contenedor{display:flex;align-items:center;gap:12px;padding-block:10px;flex-wrap:wrap}
.marca{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.marca-logo{width:40px;height:40px;border-radius:9px;background:#e90137;flex:none;overflow:hidden;display:block}
.marca-logo img{width:100%;height:100%;display:block}
.acceso{background:linear-gradient(180deg,var(--accent) 0 38%,var(--bg) 38%)}
.acceso .logo-grande{width:84px;height:84px;border-radius:18px;overflow:hidden;margin:-58px auto 0;box-shadow:0 6px 18px rgba(0,0,0,.18);border:3px solid var(--surface)}
.acceso .logo-grande img{width:100%;height:100%;display:block}
.acceso .bienvenida{text-align:center}
.acceso .bienvenida h1{font:700 1.9rem var(--display);text-transform:uppercase;letter-spacing:.03em;margin:4px 0 0}
.marca h1{font:700 1.3rem var(--display);text-transform:uppercase;letter-spacing:.02em;margin:0;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.marca small{display:block;color:var(--muted);font-size:.75rem;text-transform:uppercase;letter-spacing:.06em}
.sesion{display:flex;align-items:center;gap:8px;font-size:.9rem}
.menu{border-top:1px solid var(--line)}
.menu .contenedor{display:flex;gap:4px;overflow-x:auto;padding-block:6px;scrollbar-width:thin}
.pestana{border:0;background:transparent;color:var(--muted);font:600 .92rem var(--font);padding:8px 12px;border-radius:8px;cursor:pointer;white-space:nowrap}
.pestana[aria-current="true"]{background:var(--surface-2);color:var(--fg)}
.pestana:hover{color:var(--fg)}
main{padding-block:20px 56px;display:flex;flex-direction:column;gap:20px}

/* Tipografía */
h2{font:700 1.8rem var(--display);text-transform:uppercase;letter-spacing:.02em;margin:0;line-height:1.1}
h3{font:700 1.2rem var(--display);text-transform:uppercase;letter-spacing:.03em;margin:0}
.etiqueta{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:600}
.tenue{color:var(--muted)}

/* Estructuras */
.fila{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.extremos{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.rejilla{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr))}
.indicadores{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr))}
.tarjeta{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.tarjeta.pila{display:flex;flex-direction:column;gap:12px}
.indicador{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.indicador b{display:block;font:700 clamp(1.2rem,4.6vw,1.8rem) var(--display);overflow-wrap:anywhere;line-height:1.1;font-variant-numeric:tabular-nums}
.aviso{border-left:3px solid var(--accent);background:var(--surface);padding:10px 14px;border-radius:0 8px 8px 0}
.vacio{text-align:center;padding:32px 16px;color:var(--muted)}

/* Botones y chips */
.boton{border:1px solid var(--line);background:var(--surface);color:var(--fg);font:600 .9rem var(--font);padding:8px 14px;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.boton:hover{border-color:var(--muted)}
.boton.principal{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.boton.peligro{color:var(--bad);border-color:var(--bad)}
.boton.chico{padding:5px 10px;font-size:.82rem}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:.75rem;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface-2);white-space:nowrap}
.chip.n1,.chip.ok{background:var(--ok-bg);color:var(--ok)} .chip.n2,.chip.warn{background:var(--warn-bg);color:var(--warn)} .chip.n3,.chip.bad{background:var(--bad-bg);color:var(--bad)}

/* Formularios */
.formulario{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,180px),1fr))}
.campo{display:flex;flex-direction:column;gap:4px;min-width:0}
.campo.ancho{grid-column:1/-1}
input,select,textarea{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
textarea{min-height:70px;resize:vertical}
.opciones{display:flex;gap:8px;flex-wrap:wrap}
.opciones label{display:inline-flex;gap:6px;align-items:center;background:var(--surface-2);padding:6px 10px;border-radius:8px;cursor:pointer}
.opciones input{width:auto}
.error{color:var(--bad);font-weight:600;min-height:1.2em}

/* Tablas */
.tabla-contenedor{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:.9rem}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
th button{all:unset;cursor:pointer}
tr.clic{cursor:pointer} tr.clic:hover td{background:var(--surface-2)}
.mejora{color:var(--ok);font-weight:600} .retroceso{color:var(--warn);font-weight:600}

/* Plan */
.semanas{display:flex;gap:6px;flex-wrap:wrap}
.semana{border:1px solid var(--line);background:var(--surface);color:var(--fg);font:700 1rem var(--display);width:40px;height:40px;border-radius:8px;cursor:pointer}
.semana[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.semana.actual{box-shadow:inset 0 -3px 0 var(--accent)}
.semana[aria-pressed="true"].actual{box-shadow:inset 0 -3px 0 var(--accent-fg)}
.fase{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.fase b{font:700 1.35rem var(--display);text-transform:uppercase}
.bloque{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:6px}
.ejercicio{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center}
.ejercicio .dosis{color:var(--muted);font-size:.88rem;white-space:nowrap;font-variant-numeric:tabular-nums}
.ejercicio select{padding:4px 6px;font-size:.88rem;background:var(--surface)}

/* Gráficos */
.grafico svg{width:100%;height:auto;display:block}
.grafico .eje{stroke:var(--line)} .grafico .linea{stroke:var(--accent);fill:none;stroke-width:2.5}
.grafico .area{fill:var(--accent);opacity:.12} .grafico .punto{fill:var(--accent)} .grafico text{fill:var(--muted);font:12px var(--font)}
.grafico .barra{fill:var(--accent)} .grafico .barra0{fill:var(--surface-2)}

/* Acceso */
.acceso{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.acceso .tarjeta{width:min(100%,400px);display:flex;flex-direction:column;gap:14px}
.puntaje{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.puntaje div{background:var(--surface-2);border-radius:8px;padding:8px 10px;font-size:.82rem}
.puntaje b{font:700 1.2rem var(--display);display:block}
.aviso-flotante{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;z-index:20;max-width:calc(100% - 32px)}
[hidden]{display:none!important}
@media (max-width:600px){h2{font-size:1.5rem}.sesion .nombre-usuario{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="raiz"></div>
<div class="aviso-flotante" id="avisoFlotante" role="status" hidden></div>

<script>
/* =========================================================
   1. CATÁLOGOS Y LÓGICA DE ENTRENAMIENTO (funciones puras)
   ========================================================= */
const NIVEL={1:"Principiante",2:"Intermedio",3:"Avanzado"};
const OBJETIVO={grasa:"Pérdida de grasa",fuerza:"Fuerza",acond:"Acondicionamiento cardio",recomp:"Tonificación / recomposición"};
const LIMITACION={rodilla:"Rodilla",hombro:"Hombro",lumbar:"Zona lumbar",muneca:"Muñeca"};
const PATRON={sq:"Sentadilla",hg:"Bisagra de cadera",uni:"Pierna unilateral",ph:"Empuje horizontal",pv:"Empuje vertical",th:"Tracción horizontal",tv:"Tracción vertical",core:"Core",cardio:"Cardio",pot:"Potencia"};
// [id, nombre, patrón, nivel mínimo, zonas que carga]
const EJERCICIOS=[
 ["sq1","Sentadilla al cajón con peso corporal","sq",1,""],["sq7","Sentadilla al cajón alto (rango controlado)","sq",1,""],["sq8","Puente de glúteo con peso","sq",1,""],
 ["sq2","Sentadilla goblet con kettlebell","sq",1,"rodilla"],["sq3","Sentadilla goblet con pausa de 2 s","sq",2,"rodilla"],["sq4","Sentadilla frontal con kettlebells dobles","sq",2,"rodilla"],
 ["sq5","Sentadilla frontal con barra","sq",3,"rodilla,muneca"],["sq6","Sentadilla trasera con barra","sq",3,"rodilla,lumbar,hombro"],
 ["hg1","Peso muerto rumano con mancuernas","hg",1,"lumbar"],["hg2","Hip thrust en banco con peso corporal","hg",1,""],["hg3","Peso muerto con kettlebell","hg",1,"lumbar"],
 ["hg8","Curl femoral con fitball","hg",1,""],["hg4","Peso muerto con barra hexagonal","hg",2,"lumbar"],["hg5","Hip thrust con barra","hg",2,""],
 ["hg7","Peso muerto rumano a una pierna","hg",2,""],["hg6","Peso muerto convencional con barra","hg",3,"lumbar"],
 ["un2","Step-up al cajón bajo","uni",1,""],["un6","Puente de glúteo a una pierna","uni",1,""],["un1","Zancada estática con apoyo","uni",1,"rodilla"],
 ["un3","Zancada inversa con mancuernas","uni",2,"rodilla"],["un5","Step-up con mancuernas al cajón alto","uni",2,"rodilla"],["un4","Sentadilla búlgara","uni",3,"rodilla"],
 ["ph7","Press de pecho con banda elástica","ph",1,""],["ph2","Press de pecho con mancuernas en el suelo","ph",1,""],["ph1","Flexiones inclinadas en banco","ph",1,"muneca"],
 ["ph3","Flexiones de pecho","ph",2,"muneca"],["ph4","Press de banca con mancuernas","ph",2,""],["ph5","Press de banca con barra","ph",3,"hombro"],["ph6","Flexiones con pies elevados","ph",3,"muneca,hombro"],
 ["pv6","Press landmine de rodillas","pv",1,""],["pv1","Press de hombros sentado con mancuernas","pv",1,"hombro"],["pv2","Press landmine a una mano","pv",2,""],
 ["pv3","Press militar con kettlebell","pv",2,"hombro"],["pv4","Push press con barra","pv",3,"hombro,lumbar"],
 ["th1","Remo con banda elástica","th",1,""],["th2","Remo con mancuerna a una mano","th",1,""],["th3","Remo invertido en TRX","th",2,""],
 ["th5","Remo con pecho apoyado en banco inclinado","th",2,""],["th4","Remo con barra inclinado","th",3,"lumbar"],
 ["tv4","Jalón al pecho en polea","tv",1,""],["tv1","Jalón con banda elástica","tv",1,""],["tv2","Dominadas asistidas con banda","tv",2,"hombro"],
 ["tv5","Pullover con mancuerna","tv",2,"hombro"],["tv3","Dominadas","tv",3,"hombro"],
 ["co1","Plancha frontal sobre antebrazos","core",1,""],["co2","Dead bug","core",1,""],["co3","Pallof press con banda","core",1,""],["co5","Bird dog","core",1,""],
 ["co6","Caminata de granjero","core",1,""],["co4","Plancha lateral","core",1,"hombro"],["co8","Hollow hold","core",2,"lumbar"],["co9","Leñador con banda","core",2,""],
 ["co10","Plancha con toque de hombros","core",2,"muneca,hombro"],["co7","Rueda abdominal","core",3,"lumbar,hombro"],
 ["ca1","Bicicleta de aire","cardio",1,""],["ca11","Shadow boxing","cardio",1,""],["ca13","Step-ups rápidos al cajón bajo","cardio",1,""],["ca2","Remo ergómetro","cardio",1,"lumbar"],
 ["ca7","Jumping jacks","cardio",1,"rodilla"],["ca8","Skipping en el sitio","cardio",1,"rodilla"],["ca9","Battle ropes","cardio",1,"hombro"],["ca10","Empuje de trineo","cardio",2,""],
 ["ca3","Salto de soga","cardio",2,"rodilla"],["ca5","Mountain climbers","cardio",2,"muneca"],["ca6","Kettlebell swing","cardio",2,"lumbar"],
 ["ca12","Slam ball","cardio",2,"lumbar,hombro"],["ca4","Burpees","cardio",2,"rodilla,muneca,hombro"],["ca14","Saltos al cajón","cardio",3,"rodilla"],
 ["po6","Lanzamiento rotacional de balón medicinal a la pared","pot",1,""],["po1","Lanzamiento de balón medicinal al pecho","pot",1,""],
 ["po3","Kettlebell swing explosivo","pot",2,"lumbar"],["po4","Slam ball explosivo","pot",2,"lumbar,hombro"],["po2","Salto al cajón","pot",2,"rodilla"],["po5","Salto vertical con contramovimiento","pot",3,"rodilla"]
].map(([id,nombre,patron,nivel,evita])=>({id,nombre,patron,nivel,evita:evita?evita.split(","):[]}));
const EJERCICIO_POR_ID=Object.fromEntries(EJERCICIOS.map(e=>[e.id,e]));

// Pruebas de la evaluación física y sus cortes de nivel (referenciales para adultos)
const PRUEBAS=[
  {clave:"sentadillas",nombre:"Sentadillas en 60 s",unidad:"reps",cortes:[25,40]},
  {clave:"flexiones",nombre:"Flexiones máximas",unidad:"reps",cortes:[10,25]},
  {clave:"plancha",nombre:"Plancha frontal",unidad:"s",cortes:[45,90]},
  {clave:"burpees",nombre:"Burpees en 60 s",unidad:"reps",cortes:[12,20]}
];
function puntajePrueba(p,v){if(v==null||v===""||isNaN(v))return null;v=+v;return v>=p.cortes[1]?3:v>=p.cortes[0]?2:1;}
function nivelDeEvaluacion(ev){
  if(!ev)return null;
  const ps=PRUEBAS.map(p=>puntajePrueba(p,ev[p.clave])).filter(x=>x!=null);
  if(!ps.length)return null;
  const m=ps.reduce((a,b)=>a+b,0)/ps.length;
  return {promedio:Math.round(m*100)/100,nivel:m<1.75?1:m<2.5?2:3};
}
function calcularImc(peso,talla){if(!peso||!talla)return null;const m=talla>3?talla/100:talla;return Math.round(peso/(m*m)*10)/10;}

// Periodización de 8 semanas
const FASES=[
  {nombre:"Adaptación",semanas:[1,2],rpe:"RPE 6 · deja 4 repeticiones en reserva",i:0},
  {nombre:"Desarrollo",semanas:[3,4,5],rpe:"RPE 7 · deja 3 repeticiones en reserva",i:1},
  {nombre:"Intensificación",semanas:[6,7],rpe:"RPE 8 · deja 2 repeticiones en reserva",i:2},
  {nombre:"Descarga y reevaluación",semanas:[8],rpe:"RPE 5–6 · técnica y recuperación",i:3}
];
const DOSIS_BASE={
  fuerza:{series:[3,4,5,2],reps:["8","6","4","5"],descanso:[90,120,150,90]},
  grasa:{series:[3,3,4,2],reps:["12","15","12","12"],descanso:[45,45,40,60]},
  acond:{series:[3,4,4,2],reps:["10","10","8","10"],descanso:[60,60,45,60]},
  recomp:{series:[3,4,4,2],reps:["12","10","8","10"],descanso:[75,75,90,75]}
};
const faseDeSemana=s=>FASES.find(f=>f.semanas.includes(s))||FASES[0];
function calcularDosis(objetivo,nivel,semana){
  const f=faseDeSemana(semana),t=DOSIS_BASE[objetivo]||DOSIS_BASE.recomp,i=f.i;
  let series=t.series[i];
  if(i<3){if(nivel===1)series=Math.max(2,series-1);if(nivel===3&&i>0)series=Math.min(5,series+1);}
  const rondas=Math.max(2,[3,4,5,2][i]+(nivel===1?-1:nivel===3?1:0));
  const minutos=[8,10,12,6][i]+(nivel===1?-2:nivel===3?3:0);
  return {fase:f,series,reps:t.reps[i],descanso:t.descanso[i],rondas,minutos,
    core:["2 × 30 s / 10 reps","3 × 40 s / 12 reps","3 × 45 s / 12 reps","2 × 30 s / 10 reps"][i],
    potencia:["3 × 5 explosivas","3 × 5 explosivas","4 × 4 explosivas","2 × 4 suaves"][i]};
}
function textoMetabolico(obj,d){
  if(obj==="grasa")return `Intervalos · ${d.rondas} rondas de 40 s trabajo / 20 s pausa por ejercicio`;
  if(obj==="fuerza")return `Finisher EMOM · ${Math.max(6,d.minutos-2)} min alternando ejercicios`;
  if(obj==="acond")return `AMRAP · ${d.minutos} min, 10–12 reps o 30 s por estación`;
  return `Circuito · ${d.rondas} rondas de 45 s trabajo / 15 s pausa`;
}
const PLANTILLAS={
  A:{nombre:"Cuerpo completo A",foco:"Sentadilla y empujes",fuerza:["sq","ph","th","hg"]},
  B:{nombre:"Cuerpo completo B",foco:"Bisagra y tracción vertical",fuerza:["hg","pv","tv","uni"]},
  C:{nombre:"Cuerpo completo C",foco:"Unilateral y potencia",fuerza:["pot","uni","ph","th"]},
  I1:{nombre:"Tren inferior 1",foco:"Dominante de rodilla",fuerza:["pot","sq","uni","hg"]},
  S1:{nombre:"Tren superior 1",foco:"Empujes",fuerza:["ph","th","pv","tv"]},
  I2:{nombre:"Tren inferior 2",foco:"Dominante de cadera",fuerza:["hg","uni","sq","hg"]},
  S2:{nombre:"Tren superior 2",foco:"Tracciones",fuerza:["tv","ph","th","pv"]},
  E:{nombre:"Acondicionamiento",foco:"Cardio y movilidad",fuerza:[],cardioLargo:true}
};
const SESIONES_POR_DIAS={2:["A","B"],3:["A","B","C"],4:["I1","S1","I2","S2"],5:["I1","S1","E","I2","S2"]};
function generadorAleatorio(semilla){let h=2166136261;for(const c of String(semilla)){h^=c.charCodeAt(0);h=Math.imul(h,16777619);}return()=>{h^=h<<13;h^=h>>>17;h^=h<<5;return((h>>>0)%10000)/10000;};}
function ejerciciosPermitidos(patron,nivel,lims){
  const seguros=EJERCICIOS.filter(e=>e.patron===patron&&!e.evita.some(z=>lims.includes(z)));
  const alNivel=seguros.filter(e=>e.nivel<=nivel);
  return alNivel.length?alNivel:seguros;
}
function elegirEjercicio(patron,nivel,lims,usados,azar){
  let c=ejerciciosPermitidos(patron,nivel,lims).filter(e=>!usados.has(e.id));
  if(!c.length)c=ejerciciosPermitidos(patron,nivel,lims);
  if(!c.length)return null;
  const tope=Math.max(...c.map(e=>e.nivel)),pref=c.filter(e=>e.nivel===tope),pool=pref.length>=2?pref:c;
  const e=pool[Math.floor(azar()*pool.length)];usados.add(e.id);return e.id;
}
function generarPlan({objetivo,nivel,dias,limitaciones,inicio,semilla}){
  const lims=limitaciones||[],azar=generadorAleatorio(semilla||"x"),usados=new Set();
  const nCardio=objetivo==="fuerza"?2:objetivo==="recomp"?3:4;
  const sesiones=(SESIONES_POR_DIAS[dias]||SESIONES_POR_DIAS[3]).map(clave=>{
    const t=PLANTILLAS[clave];
    const fuerza=t.fuerza.map(p=>{if(p==="pot"&&nivel===1)p="uni";return{patron:p,ej:elegirEjercicio(p,nivel,lims,usados,azar)};}).filter(x=>x.ej);
    const cardio=[],core=[];
    for(let i=0;i<(t.cardioLargo?3:nCardio);i++){const id=elegirEjercicio("cardio",nivel,lims,usados,azar);if(id)cardio.push(id);}
    for(let i=0;i<(t.cardioLargo?3:2);i++){const id=elegirEjercicio("core",nivel,lims,usados,azar);if(id)core.push(id);}
    return{clave,nombre:t.nombre,foco:t.foco,cardioLargo:!!t.cardioLargo,fuerza,cardio,core};
  });
  return{inicio,objetivo,nivel,dias,limitaciones:lims,sesiones,nota:""};
}
function semanaDelPlan(plan,fecha){
  if(!plan||!plan.inicio)return 1;
  const d=Math.floor((new Date(fecha+"T12:00:00")-new Date(plan.inicio+"T12:00:00"))/864e5);
  return Math.min(8,Math.max(1,Math.floor(d/7)+1));
}

// Hash de contraseña con sal (SHA-256 cuando el navegador lo permite)
async function hashClave(clave,sal){
  const texto=sal+"|"+clave;
  if(window.crypto&&crypto.subtle){
    const buf=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(texto));
    return[...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,"0")).join("");
  }
  let h=2166136261;for(const c of texto){h^=c.charCodeAt(0);h=Math.imul(h,16777619);}return"f"+(h>>>0).toString(16);
}

const ordenarFecha=arr=>(arr||[]).slice().sort((a,b)=>a.fecha<b.fecha?-1:1);
const ultimaEvaluacion=a=>{const e=ordenarFecha(a.evaluaciones);return e[e.length-1]||null;};
function nivelAlumno(a){if(a.nivelManual)return+a.nivelManual;const n=nivelDeEvaluacion(ultimaEvaluacion(a));return n?n.nivel:1;}
function estadoMembresia(a){
  const m=a.membresia;if(!m||!m.vence)return{clase:"bad",texto:"Sin membresía",dias:null};
  const d=diasEntre(hoy(),m.vence);
  if(d<0)return{clase:"bad",texto:`Vencida hace ${-d} d`,dias:d};
  if(d<=7)return{clase:"warn",texto:`Vence en ${d} d`,dias:d};
  return{clase:"ok",texto:`Activa hasta ${fechaCorta(m.vence)}`,dias:d};
}
const evaluacionPendiente=a=>{const u=ultimaEvaluacion(a);return!u||sumarDias(u.fecha,28)<=hoy();};
const asistenciasDesde=(a,desde)=>(a.asistencias||[]).filter(x=>x.fecha>=desde).length;
function resumenAvance(a){
  const ev=ordenarFecha(a.evaluaciones),pr=ordenarFecha(a.progreso);
  const serie=k=>[...ev,...pr].filter(x=>x[k]!=null).sort((x,y)=>x.fecha<y.fecha?-1:1);
  const delta=k=>{const s=serie(k);return s.length>=2?Math.round((s[s.length-1][k]-s[0][k])*10)/10:null;};
  const puntaje=e=>{const n=nivelDeEvaluacion(e);return n?n.promedio:null;};
  const dPuntaje=ev.length>=2&&puntaje(ev[0])!=null&&puntaje(ev[ev.length-1])!=null?Math.round((puntaje(ev[ev.length-1])-puntaje(ev[0]))*100)/100:null;
  const actividad=[...(a.asistencias||[]),...pr,...ev].map(x=>x.fecha).sort().pop()||null;
  return{peso:delta("peso"),cintura:delta("cintura"),puntaje:dPuntaje,asist4:asistenciasDesde(a,sumarDias(hoy(),-28)),actividad};
}

const chipNivel=n=>`<span class="chip n${n}">${NIVEL[n]}</span>`;
function graficoLinea(puntos,unidad){
  puntos=puntos.filter(p=>p.y!=null).sort((a,b)=>a.x<b.x?-1:1);
  if(puntos.length<2)return`<p class="tenue">Se necesitan al menos 2 registros para ver la curva.</p>`;
  const W=600,H=190,L=44,R=16,T=14,B=30,ys=puntos.map(p=>p.y);
  let mn=Math.min(...ys),mx=Math.max(...ys);if(mn===mx){mn-=1;mx+=1;}const m=(mx-mn)*.15;mn-=m;mx+=m;
  const t0=new Date(puntos[0].x).getTime(),t1=new Date(puntos[puntos.length-1].x).getTime();
  const X=x=>L+(W-L-R)*((new Date(x).getTime()-t0)/((t1-t0)||1)),Y=y=>T+(H-T-B)*(1-(y-mn)/(mx-mn));
  let g="";for(let i=0;i<=3;i++){const v=mn+(mx-mn)*i/3,y=Y(v);g+=`<line class="eje" x1="${L}" x2="${W-R}" y1="${y}" y2="${y}"/><text x="${L-6}" y="${y+4}" text-anchor="end">${Math.round(v*10)/10}</text>`;}
  const d=puntos.map((p,i)=>(i?"L":"M")+X(p.x).toFixed(1)+" "+Y(p.y).toFixed(1)).join(" ");
  const u=puntos[puntos.length-1];
  return`<div class="grafico"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolución en ${escapar(unidad)}">${g}<path class="area" d="${d} L${X(u.x)} ${H-B} L${X(puntos[0].x)} ${H-B} Z"/><path class="linea" d="${d}"/>${puntos.map(p=>`<circle class="punto" cx="${X(p.x)}" cy="${Y(p.y)}" r="3"/>`).join("")}<circle class="punto" cx="${X(u.x)}" cy="${Y(u.y)}" r="5.5"/><text x="${L}" y="${H-8}">${fechaCorta(puntos[0].x)}</text><text x="${W-R}" y="${H-8}" text-anchor="end">${fechaCorta(u.x)} · ${u.y} ${escapar(unidad)}</text></svg></div>`;
}
function graficoAsistencia(asist){
  const W=600,H=170,L=30,R=10,T=14,B=30,n=8;
  const lunes=f=>{const x=new Date(f+"T12:00:00");x.setDate(x.getDate()-((x.getDay()+6)%7));return x.toISOString().slice(0,10);};
  const base=lunes(hoy()),sem=[];for(let i=n-1;i>=0;i--)sem.push(sumarDias(base,-7*i));
  const cnt=sem.map(s=>(asist||[]).filter(a=>lunes(a.fecha)===s).length),mx=Math.max(3,...cnt),paso=(W-L-R)/n,ancho=paso*.62;
  let g="";for(let i=0;i<=mx;i+=Math.ceil(mx/3)){const y=T+(H-T-B)*(1-i/mx);g+=`<line class="eje" x1="${L}" x2="${W-R}" y1="${y}" y2="${y}"/><text x="${L-6}" y="${y+4}" text-anchor="end">${i}</text>`;}
  sem.forEach((s,i)=>{const h=Math.max(2,(H-T-B)*cnt[i]/mx),x=L+paso*i+(paso-ancho)/2;g+=`<rect class="${cnt[i]?"barra":"barra0"}" x="${x}" y="${H-B-h}" width="${ancho}" height="${h}" rx="3"/><text x="${x+ancho/2}" y="${H-10}" text-anchor="middle">${s.slice(8)}/${s.slice(5,7)}</text>`;});
  return`<div class="grafico"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Sesiones por semana en las últimas 8 semanas">${g}</svg></div>`;
}

function moduloAvance(){
  const filas=listaAlumnos().map(a=>({a,n:nivelAlumno(a),r:resumenAvance(a),sem:a.plan?semanaDelPlan(a.plan,hoy()):null}));
  const {campo,dir}=ui.orden;
  const valor=f=>({nombre:f.a.nombre,nivel:f.n,semana:f.sem??-1,asist:f.r.asist4,peso:f.r.peso??999,cintura:f.r.cintura??999,puntaje:f.r.puntaje??-999,actividad:f.r.actividad||""})[campo];
  filas.sort((x,y)=>{const a=valor(x),b=valor(y);return(a<b?-1:a>b?1:0)*dir;});
  const cab=(k,t)=>`<th><button data-ordenar="${k}">${t}${campo===k?(dir>0?" ▲":" ▼"):""}</button></th>`;
  const fmt=(v,u,mejorSiBaja)=>v==null?"—":`<span class="${v===0?"":(mejorSiBaja?v<0:v>0)?"mejora":"retroceso"}">${v>0?"+":""}${v} ${u}</span>`;
  return`<section><div class="etiqueta">Seguimiento</div><h2>Avance de alumnos</h2><p class="tenue" style="margin:4px 0 0">Cambios desde el primer registro de cada alumno. Pulsa un encabezado para ordenar y una fila para abrir la ficha.</p></section>
  ${filas.length?`<section class="tarjeta tabla-contenedor"><table><thead><tr>${cab("nombre","Alumno")}${cab("nivel","Nivel")}${cab("semana","Semana plan")}${cab("asist","Sesiones 4 sem")}${cab("peso","Δ Peso")}${cab("cintura","Δ Cintura")}${cab("puntaje","Δ Puntaje pruebas")}${cab("actividad","Última actividad")}<th>Membresía</th></tr></thead><tbody>
  ${filas.map(({a,n,r,sem})=>{const m=estadoMembresia(a);return`<tr class="clic" data-abrir="${a.id}" tabindex="0"><td><b>${escapar(a.nombre)}</b></td><td>${chipNivel(n)}</td><td>${sem?`${sem}/8 · ${faseDeSemana(sem).nombre}`:"Sin plan"}</td><td>${r.asist4} / ${(a.dias||3)*4}</td><td>${fmt(r.peso,"kg",a.objetivo!=="fuerza")}</td><td>${fmt(r.cintura,"cm",true)}</td><td>${fmt(r.puntaje,"pts",false)}</td><td>${r.actividad?fechaCorta(r.actividad):"—"}</td><td><span class="chip ${m.clase}">${m.texto}</span></td></tr>`;}).join("")}
  </tbody></table></section>`:`<div class="tarjeta vacio">Cuando registres alumnos verás aquí su avance comparado.</div>`}`;
}
function moduloAsistencia(){
  const al=listaAlumnos(),f=hoy();
  return`<section><div class="etiqueta">Control diario</div><h2>Asistencia de hoy</h2><p class="tenue" style="margin:4px 0 0">${fechaCorta(f)} · marca a cada alumno al llegar. Se registra con la siguiente sesión de su plan.</p></section>
  ${al.length?`<section class="tarjeta tabla-contenedor"><table><thead><tr><th>Alumno</th><th>Grupo</th><th>Membresía</th><th>Sesión que toca</th><th></th></tr></thead><tbody>${al.map(a=>{const m=estadoMembresia(a),ya=(a.asistencias||[]).find(x=>x.fecha===f),sig=siguienteSesion(a);
    return`<tr><td>${escapar(a.nombre)}</td><td>${escapar(config().grupos[nivelAlumno(a)])}</td><td><span class="chip ${m.clase}">${m.texto}</span></td><td>${sig?escapar(sig.nombre):"Sin plan"}</td><td>${ya?`<span class="chip ok">Asistió</span> <button class="boton chico" data-quitar-asistencia-hoy="${a.id}">Deshacer</button>`:`<button class="boton chico principal" data-marcar-hoy="${a.id}">Marcar asistencia</button>`}</td></tr>`;}).join("")}</tbody></table></section>`:`<div class="tarjeta vacio">Registra alumnos para controlar la asistencia.</div>`}`;
}
function siguienteSesion(a){
  if(!a.plan)return null;const ses=a.plan.sesiones;const ult=ordenarFecha(a.asistencias).pop();
  if(!ult)return ses[0];const i=ses.findIndex(s=>s.clave===ult.sesion);return ses[(i+1)%ses.length];
}
function moduloPagos(){
  const al=listaAlumnos(),c=config(),mes=hoy().slice(0,7);
  const pagos=al.flatMap(a=>(a.pagos||[]).map(p=>({...p,alumno:a.nombre,alumnoId:a.id}))).sort((a,b)=>a.fecha<b.fecha?1:-1);
  const totalMes=pagos.filter(p=>p.fecha.startsWith(mes)).reduce((s,p)=>s+(+p.monto||0),0);
  const porVencer=al.map(a=>({a,m:estadoMembresia(a)})).filter(x=>x.m.clase!=="ok").sort((x,y)=>(x.m.dias??-999)-(y.m.dias??-999));
  return`<section><div class="etiqueta">Cobranza</div><h2>Membresías y pagos</h2></section>
  <section class="indicadores"><div class="indicador"><span class="etiqueta">Cobrado este mes</span><b>${dinero(totalMes)}</b></div><div class="indicador"><span class="etiqueta">Activas</span><b>${al.filter(a=>estadoMembresia(a).clase==="ok").length}</b></div><div class="indicador"><span class="etiqueta">Por renovar</span><b>${porVencer.length}</b></div></section>
  <section class="tarjeta pila"><h3>Por renovar</h3>${porVencer.length?`<div class="tabla-contenedor"><table><thead><tr><th>Alumno</th><th>Plan</th><th>Estado</th><th></th></tr></thead><tbody>${porVencer.map(({a,m})=>`<tr><td>${escapar(a.nombre)}</td><td>${escapar(a.membresia?.planNombre||"—")}</td><td><span class="chip ${m.clase}">${m.texto}</span></td><td><button class="boton chico" data-abrir-pago="${a.id}">Registrar pago</button></td></tr>`).join("")}</tbody></table></div>`:`<span class="chip ok">Todas las membresías al día</span>`}</section>
  <section class="tarjeta pila"><h3>Últimos pagos</h3>${pagos.length?`<div class="tabla-contenedor"><table><thead><tr><th>Fecha</th><th>Alumno</th><th>Concepto</th><th>Medio</th><th>Monto</th></tr></thead><tbody>${pagos.slice(0,30).map(p=>`<tr><td>${fechaCorta(p.fecha)}</td><td>${escapar(p.alumno)}</td><td>${escapar(p.concepto)}</td><td>${escapar(p.medio||"")}</td><td>${dinero(p.monto)}</td></tr>`).join("")}</tbody></table></div>`:`<p class="tenue">Aún no hay pagos registrados.</p>`}</section>
  <section class="tarjeta pila"><h3>Planes de membresía</h3><div class="tabla-contenedor"><table><thead><tr><th>Plan</th><th>Duración</th><th>Precio</th></tr></thead><tbody>${c.planes.map(p=>`<tr><td>${escapar(p.nombre)}</td><td>${p.dias} días</td><td>${dinero(p.precio)}</td></tr>`).join("")}</tbody></table></div><span class="tenue">Puedes cambiarlos en Ajustes.</span></section>`;
}

function leerPerfil(base){
  const a=Object.assign({},base);
  a.nombre=$("#pf_nombre").value.trim();a.edad=numero($("#pf_edad").value);a.sexo=$("#pf_sexo").value;a.telefono=$("#pf_telefono").value.trim();

function sugerirUsuario(nombre){
  const p=(nombre||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z ]/g,"").trim().split(/\s+/);
  let base=(p[0]||"alumno")+(p[1]?"."+p[1]:"");let u=base,i=2;while(datos.usuarios.some(x=>x.usuario===u))u=base+i++;return u;
}
function claveSugerida(){const c="abcdefghjkmnpqrstuvwxyz23456789";let s="";const r=new Uint32Array(8);(window.crypto||{getRandomValues:a=>a.map(()=>Math.random()*1e9)}).getRandomValues(r);r.forEach(x=>s+=c[x%c.length]);return s;}

function apartadoAlumno(a,seccion,previa){
  const c=config(),n=nivelAlumno(a),ev=ordenarFecha(a.evaluaciones),ue=ev[ev.length-1],m=estadoMembresia(a);
  const act=a.plan?semanaDelPlan(a.plan,hoy()):null,sem=ui.semana||act;
  const mes=hoy().slice(0,7),asisMes=(a.asistencias||[]).filter(x=>x.fecha.startsWith(mes)).length;
  let cuerpo="";
  if(seccion==="plan")cuerpo=a.plan?`${a.plan.nota?`<div class="aviso"><div class="etiqueta">Nota de tu entrenador</div>${escapar(a.plan.nota)}</div>`:""}<section class="tarjeta pila"><div class="extremos"><h3>Tu entrenamiento</h3>${selectorSemanas(sem,act)}</div>${vistaSesiones(a.plan,sem,{registrar:!previa,asistencias:a.asistencias||[]})}</section>`:`<div class="tarjeta vacio">Tu entrenador está preparando tu plan. Aparecerá aquí apenas esté listo.</div>`;
  if(seccion==="progreso")cuerpo=`${previa?"":formularioProgreso()}<section class="tarjeta pila"><h3>Tu evolución</h3>${comparativaEvaluaciones(ev)}${graficosProgreso(a)}</section><section class="tarjeta pila"><h3>Tus registros</h3>${tablaProgreso(a,false)}</section>`;
  if(seccion==="evaluaciones")cuerpo=`<section class="tarjeta pila"><h3>Tus evaluaciones</h3>${tablaEvaluaciones(ev,false)}</section>`;
  if(seccion==="cuenta")cuerpo=`<section class="tarjeta pila"><h3>Tu membresía</h3><span class="chip ${m.clase}">${m.texto}</span>${a.membresia?`<span class="tenue">${escapar(a.membresia.planNombre)} · ${fechaCorta(a.membresia.inicio)} al ${fechaCorta(a.membresia.vence)}</span>`:""}</section>
    <form class="formulario tarjeta" id="formClaveAlumno"><div class="campo ancho"><h3>Cambiar contraseña</h3></div><div class="campo"><label class="etiqueta" for="cl_actual">Contraseña actual</label><input id="cl_actual" type="password" required autocomplete="current-password"></div><div class="campo"><label class="etiqueta" for="cl_nueva">Nueva contraseña</label><input id="cl_nueva" type="password" required minlength="6" autocomplete="new-password"></div><div class="campo ancho"><button class="boton principal" type="submit">Cambiar contraseña</button></div></form>`;
  return`<section><div class="etiqueta">${escapar(c.nombre)}</div><h2>Hola, ${escapar(a.nombre.split(" ")[0])}</h2><div class="tenue">${escapar(OBJETIVO[a.objetivo]||"")}${c.entrenador?` · Entrenador: ${escapar(c.entrenador)}`:""}</div></section>
  <section class="indicadores">
    <div class="indicador"><span class="etiqueta">Nivel</span><b>${NIVEL[n]}</b><span class="tenue">${escapar(c.grupos[n])}</span></div>
    <div class="indicador"><span class="etiqueta">Plan</span><b>${act?`Semana ${act}/8`:"—"}</b><span class="tenue">${act?faseDeSemana(act).nombre:"En preparación"}</span></div>
    <div class="indicador"><span class="etiqueta">Sesiones este mes</span><b>${asisMes}</b><span class="tenue">${(a.asistencias||[]).length} en total</span></div>
    <div class="indicador"><span class="etiqueta">Próxima evaluación</span><b>${ue?fechaCorta(sumarDias(ue.fecha,28)):"Pendiente"}</b><span class="tenue">Membresía: ${m.texto.toLowerCase()}</span></div>

function actualizarAlumno(id,cambio){const a=structuredClone(datos.alumnos[id]);cambio(a);a.actualizado=new Date().toISOString();datos.alumnos[id]=a;guardarDatos();pintar();}

function leerRegistroProgreso(autor){
  const r={id:nuevoId(),fecha:$("#pr_fecha").value,nota:$("#pr_nota").value.trim(),autor};

async function descargarCopia(){
  const nombre=`copia-gimnasio-${hoy()}.json`,texto=JSON.stringify(datos,null,2);
  // Dentro de claude.ai la descarga pasa por el permiso del visor; en un archivo local se usa un enlace normal
  const dl=window.claude&&window.claude.use?await window.claude.use("downloads").catch(()=>null):null;
  if(dl){try{await dl.save({filename:nombre,data:new Blob([texto],{type:"application/json"})});}catch(_){avisar("La descarga se canceló.");}return;}
  const blob=new Blob([JSON.stringify(datos,null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");
  a.href=url;a.download=nombre;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
}

  const accion=d.accion;
  if(accion==="salir")cerrarSesion();
  if(accion==="cargarDemo"||accion==="reiniciarDemo"){crearDemo().then(d=>{datos=d;guardarDatos();usuarioActual=null;try{sessionStorage.removeItem(CLAVE_SESION);}catch(_){}pintar();avisar("Demo lista. Entra con uno de los accesos de prueba.");});return;}
  if(accion==="nuevoAlumno"){ui.vista="nuevo";pintar();}
  if(accion==="eliminar"){ui.confirmar="eliminar";pintar();}
  if(accion==="regenerar"){ui.confirmar="regenerar";pintar();}
  if(accion==="cancelar"){ui.confirmar=null;pintar();}
  if(accion==="eliminarConfirmado"){const id=ui.alumnoId;delete datos.alumnos[id];datos.usuarios=datos.usuarios.filter(u=>u.alumnoId!==id);guardarDatos();Object.assign(ui,{vista:"alumnos",alumnoId:null,confirmar:null});pintar();avisar("Alumno eliminado");}
  if(accion==="generarPlan"){const inicio=$("#pl_inicio").value||hoy();actualizarAlumno(ui.alumnoId,a=>{const nota=a.plan?.nota||"";a.plan=generarPlan({objetivo:a.objetivo,nivel:nivelAlumno(a),dias:+a.dias||3,limitaciones:a.limitaciones||[],inicio,semilla:a.id+Date.now()});a.plan.nota=nota;});ui.confirmar=null;ui.semana=null;pintar();avisar("Plan de 8 semanas generado");}
  if(accion==="guardarNota"){const nota=$("#pl_nota").value;actualizarAlumno(ui.alumnoId,a=>{a.plan.nota=nota;});avisar("Nota guardada");}
  if(accion==="suspenderUsuario"||accion==="activarUsuario"){const u=datos.usuarios.find(x=>x.alumnoId===ui.alumnoId);u.activo=accion==="activarUsuario";guardarDatos();pintar();avisar(u.activo?"Acceso reactivado":"Acceso suspendido");}
  if(accion==="exportar")descargarCopia();
});

/* =========================================================
   11. DATOS DE DEMOSTRACIÓN (personas y cifras ficticias)
   ========================================================= */
async function crearDemo(){
  const f=n=>sumarDias(hoy(),n);
  const d={demo:true,config:{...structuredClone(CONFIG_INICIAL),entrenador:"Coach Demo"},usuarios:[],alumnos:{}};
  const usuario=async(nombre,rol,alumnoId)=>{const sal=nuevoId();d.usuarios.push({id:nuevoId(),usuario:nombre,sal,hash:await hashClave("demo123",sal),rol,alumnoId,activo:true});};
  await usuario("entrenador","admin");
  const perfiles=[
    {u:"lucia.ramos",nombre:"Lucía Ramos",edad:34,sexo:"Femenino",objetivo:"grasa",dias:3,lim:["rodilla"],ini:-56,peso:[72.4,70.9,69.6],cin:[86,83.5,81.5],t:[[28,8,50,13],[34,12,65,16],[38,14,80,18]],memb:22,plan:"mensual"},
    {u:"diego.salas",nombre:"Diego Salas",edad:29,sexo:"Masculino",objetivo:"fuerza",dias:4,lim:[],ini:-42,peso:[78,79.1],cin:[84,83.5],t:[[42,26,95,19],[45,30,110,21]],memb:60,plan:"trimestral",marcas:true},
    {u:"carmen.vidal",nombre:"Carmen Vidal",edad:47,sexo:"Femenino",objetivo:"recomp",dias:2,lim:["lumbar"],ini:-30,peso:[66.2,65.4],cin:[82,80],t:[[22,6,40,9],[27,9,55,12]],memb:-3,plan:"mensual"},
    {u:"jorge.quispe",nombre:"Jorge Quispe",edad:38,sexo:"Masculino",objetivo:"acond",dias:3,lim:["hombro"],ini:-20,peso:[91.5,90.2],cin:[101,99],t:[[30,15,70,14],[33,17,80,16]],memb:5,plan:"clases12"},
    {u:"valeria.mendoza",nombre:"Valeria Mendoza",edad:25,sexo:"Femenino",objetivo:"recomp",dias:5,lim:[],ini:-14,peso:[58.3],cin:[69],t:[[44,22,100,21]],memb:16,plan:"mensual"},
    {u:"raul.torres",nombre:"Raúl Torres",edad:56,sexo:"Masculino",objetivo:"grasa",dias:2,lim:["rodilla","muneca"],ini:-6,peso:[88.7],cin:[104],t:[[18,4,30,7]],memb:24,plan:"mensual",sinApto:true}
  ];
  const cfg=d.config;
  for(const p of perfiles){
    const id=nuevoId(),a={id,nombre:p.nombre,edad:p.edad,sexo:p.sexo,telefono:"",objetivo:p.objetivo,dias:p.dias,nivelManual:null,limitaciones:p.lim,
      salud:p.lim.length?"Dato de ejemplo: molestia leve reportada en la evaluación inicial.":"",aptoMedico:!p.sinApto,notasPrivadas:"",creado:f(p.ini),evaluaciones:[],progreso:[],asistencias:[],pagos:[]};
    p.t.forEach((t,i)=>a.evaluaciones.push({id:nuevoId(),fecha:f(p.ini+i*(p.t.length>1?Math.min(28,Math.floor(-p.ini/(p.t.length-1))):0)),peso:p.peso[i],talla:p.sexo==="Femenino"?162:174,cintura:p.cin[i],cadera:null,grasa:null,fcReposo:76-i*3,
      sentadillas:t[0],flexiones:t[1],plancha:t[2],burpees:t[3],salto:null,flexibilidad:null,nota:i?"Reevaluación":"Evaluación inicial"}));
    const nivel=nivelAlumno(a);
    a.plan=generarPlan({objetivo:p.objetivo,nivel,dias:p.dias,limitaciones:p.lim,inicio:f(p.ini+2),semilla:p.u});
    if(p.u==="lucia.ramos")a.plan.nota="Vas muy bien: esta semana sube un poco el peso si terminas las series con buena técnica.";
    // asistencias: ~ días por semana desde el inicio del plan
    const claves=a.plan.sesiones.map(s=>s.clave);let k=0;
    for(let dd=p.ini+2;dd<=0;dd++){const dia=new Date(f(dd)+"T12:00:00").getDay();const ok=p.dias>=5?dia>=1&&dia<=5:p.dias===4?[1,2,4,5].includes(dia):p.dias===3?[1,3,5].includes(dia):[2,4].includes(dia);
      if(ok&&(dd*7+p.edad)%9!==0){a.asistencias.push({id:nuevoId(),fecha:f(dd),sesion:claves[k%claves.length]});k++;}}
    // registros de progreso semanales
    for(let w=1;w*7<-p.ini;w++){const fr=w/(-p.ini/7),pi=p.peso[0]+(p.peso[p.peso.length-1]-p.peso[0])*fr;
      a.progreso.push({id:nuevoId(),fecha:f(p.ini+w*7),peso:Math.round(pi*10)/10,cintura:null,autor:w%2?"alumno":"entrenador",nota:"",
        sentadilla:p.marcas?60+w*5:null,pesoMuerto:p.marcas?80+w*7.5:(p.objetivo==="grasa"?24+w*2:null),press:p.marcas?50+w*2.5:(p.objetivo!=="acond"?14+w:null),remo:p.marcas?40+w*2.5:null});}
    // membresía y pagos
    const plan=cfg.planes.find(x=>x.id===p.plan),vence=f(p.memb),inicio=sumarDias(vence,-(plan.dias-1));
    a.membresia={planId:plan.id,planNombre:plan.nombre,inicio,vence};
    a.pagos.push({id:nuevoId(),fecha:inicio,monto:plan.precio,medio:["Yape","Efectivo","Plin","Transferencia"][p.edad%4],concepto:`${plan.nombre} (${fechaCorta(inicio)} – ${fechaCorta(vence)})`});
    if(p.ini<-35){const v2=sumarDias(inicio,-1),i2=sumarDias(v2,-(plan.dias-1));a.pagos.push({id:nuevoId(),fecha:i2,monto:plan.precio,medio:"Efectivo",concepto:`${plan.nombre} (${fechaCorta(i2)} – ${fechaCorta(v2)})`});}
    d.alumnos[id]=a;await usuario(p.u,"alumno",id);
  }
  return d;
}
